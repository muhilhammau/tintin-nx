# The Adventures of Tintin: The Game HD 1.0.5 -- modules, in load order.
# libStormGLOFT.so first: libtintin.so imports operator new/delete and __cxa_*
# from it (it has no DT_NEEDED on it; Java loads StormGLOFT, then tintin).
# libnativeinterface.so (Samsung licence check) is NOT loaded: answered in JNI.
MODULES libStormGLOFT.so libtintin.so

# Old armeabi-v7a build may import ARM EABI/libgcc helpers directly; the same
# AAPCS/softfp ABI as the AArch32 Switch toolchain. gen_imports.py reports any
# that are missing; add them here as PASSTHROUGH.
PASSTHROUGH __aeabi_d2f __aeabi_d2iz __aeabi_d2uiz __aeabi_dadd __aeabi_dcmpeq __aeabi_dcmpge __aeabi_dcmple __aeabi_ddiv __aeabi_dmul __aeabi_dsub
PASSTHROUGH __aeabi_f2iz __aeabi_fadd __aeabi_fcmpeq __aeabi_fcmpge __aeabi_fcmple __aeabi_fcmpun __aeabi_fdiv __aeabi_fmul __aeabi_fsub
PASSTHROUGH __aeabi_i2d __aeabi_i2f __aeabi_ldivmod __aeabi_lmul __aeabi_ui2d __aeabi_ui2f __aeabi_uidiv __aeabi_uidivmod
PASSTHROUGH __aeabi_unwind_cpp_pr0 __aeabi_unwind_cpp_pr1

DATA __dso_handle __dso_handle

# Tintin: ctype/math/wide-char functions whose ABI matches newlib.
PASSTHROUGH frexpf ldexpf sinhf isprint
PASSTHROUGH iswalpha iswcntrl iswdigit iswlower iswprint iswpunct iswspace iswupper iswxdigit
PASSTHROUGH wcscmp wcsncpy
